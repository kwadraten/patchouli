[package]
name = "patchouli-shell-sidecar"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bashkit-driven read-only virtual shell sidecar for Patchouli MCP"
license = "GPL-3.0-or-later"

[dependencies]
bashkit = { version = "=0.14.4", default-features = false, features = ["jq"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "io-std"] }
async-trait = "0.1"
bytes = "1"
thiserror = "2"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
