name: Desktop instance coordinator tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Desktop instance tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Run single instance and control channel tests
        run: >-
          dotnet fsi --warnaserror+ scripts/run-tests.fsx --
          --filter "FullyQualifiedName~DesktopInstanceCoordinator|FullyQualifiedName~DesktopInstanceActivation"
          --run-id desktop-instance
      - name: Validate SDK-only automation on all platforms
        run: dotnet fsi --warnaserror+ tests/ScriptAutomationTests.fsx
      - name: Upload desktop instance test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-instance-tests-${{ matrix.os }}
          path: .tmp/test-runs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
