name: Package smoke

on:
  pull_request:
    paths:
      - '.github/workflows/package-smoke.yml'
      - '.github/workflows/release.yml'
      - 'scripts/**/*.fsx'
      - 'scripts/lib/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - '**/*.csproj'
      - '**/*.fsproj'
      - 'scripts/Patchouli.ExtensionSchemas/**'
      - 'sidecar/Patchouli.Extensions.Compiler/**'
      - 'src/Patchouli.Extensions*/**'
      - 'packaging/windows/**'
      - 'packaging/macos/**'
      - 'sidecar/biblatex-helper/**'
      - 'sidecar/patchouli-macos-fs/**'
      - 'tests/Patchouli.Tests/**'

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows package from a clean publish directory
        run: dotnet fsi --warnaserror+ scripts/package-windows.fsx -- --runtime win-x64 --smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-package-smoke
          path: .tmp/installer/**
          include-hidden-files: true
          if-no-files-found: warn

  macos-package:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and validate macOS DMG
        run: dotnet fsi --warnaserror+ scripts/package-macos.fsx -- --runtime osx-arm64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-package-smoke
          path: .tmp/installer/**
          include-hidden-files: true
          if-no-files-found: warn

  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils imagemagick zstd
      - name: Build Linux DEB from a clean publish directory
        run: dotnet fsi --warnaserror+ scripts/package-linux.fsx -- --format deb
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-package-smoke
          path: .tmp/installer/**
          include-hidden-files: true
          if-no-files-found: warn
