name: Package release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build Windows installer
        run: dotnet fsi --warnaserror+ scripts/package-windows.fsx -- --runtime win-x64 --version "${{ github.ref_name }}"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: patchouli-windows
          path: .tmp/installer/*.exe
          include-hidden-files: true
          if-no-files-found: error

  package-macos:
    name: Package macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build ad-hoc signed macOS disk image
        run: dotnet fsi --warnaserror+ scripts/package-macos.fsx -- --runtime osx-arm64 --version "${{ github.ref_name }}"
      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: patchouli-macos
          path: .tmp/installer/*.dmg
          include-hidden-files: true
          if-no-files-found: error

  package-linux:
    name: Package Linux (deb, rpm, AppImage, Flatpak)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils imagemagick rpm zstd flatpak curl
      - name: Install Flatpak runtime and SDK
        run: |
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y --arch=x86_64 flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
      - name: Build Linux packages
        run: dotnet fsi --warnaserror+ scripts/package-linux.fsx -- --runtime linux-x64 --version "${{ github.ref_name }}"
      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: patchouli-linux
          path: |
            .tmp/installer/*.deb
            .tmp/installer/*.rpm
            .tmp/installer/*.AppImage
            .tmp/installer/*.flatpak
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - package-windows
      - package-macos
      - package-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: .tmp/release-assets
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: dotnet fsi --warnaserror+ scripts/publish-release.fsx -- --tag "${{ github.ref_name }}"
